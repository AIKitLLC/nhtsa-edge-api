name: zz probe vPIC dump (temporary)

on:
  push:
    branches: [claude/exciting-pascal-8khdrj]
    paths: [.github/workflows/zz-probe-vpic.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets present?
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ] && echo "CLOUDFLARE_API_TOKEN: set" || echo "CLOUDFLARE_API_TOKEN: MISSING"
          [ -n "$CF_ACCOUNT" ] && echo "CLOUDFLARE_ACCOUNT_ID: set" || echo "CLOUDFLARE_ACCOUNT_ID: MISSING"

      - name: Downloads index
        run: |
          curl -sSL -A "Mozilla/5.0" https://vpic.nhtsa.dot.gov/downloads/ -o index.html || true
          grep -oiE 'href="[^"]+"' index.html | sort -u | head -80

      - name: Download dump
        run: |
          set -e
          for m in 2026_09 2026_08 2026_07; do
            if curl -sSfL -A "Mozilla/5.0" -o dump.zip "https://vpic.nhtsa.dot.gov/downloads/vPICList_lite_${m}.plain.zip"; then echo "GOT $m"; break; fi
          done
          ls -la dump.zip
          unzip -o dump.zip -d dump
          ls -laR dump | head -20

      - name: Tables, row counts
        run: |
          F=$(ls dump/*.sql dump/**/*.sql 2>/dev/null | head -1)
          echo "FILE=$F"; wc -c "$F"
          echo "== CREATE TABLE =="
          grep -nE '^CREATE TABLE' "$F" | head -200
          echo "== COPY row counts =="
          awk '/^COPY /{t=$2; n=0; inb=1; next} inb && /^\\\.$/{print n, t; inb=0; next} inb{n++}' "$F" | sort -rn | head -120

      - name: Key table definitions
        run: |
          F=$(ls dump/*.sql | head -1)
          for t in pattern vinschema wmi_vinschema wmi element wmi_make make model make_model vehiclespecschema vehiclespecpattern vspecschemapattern defaultvalue errorcode; do
            echo "===== $t"
            awk -v t="$t" 'BEGIN{IGNORECASE=1} $0 ~ "^CREATE TABLE [a-z_]*\\.?\"?"t"\"? \\(" {p=1} p{print} p && /^\);/{p=0}' "$F"
          done

      - name: Sample rows
        run: |
          F=$(ls dump/*.sql | head -1)
          for t in pattern vinschema wmi_vinschema wmi element wmi_make make model make_model vehiclespecschema vehiclespecpattern vspecschemapattern; do
            echo "===== $t"
            awk -v t="$t" 'BEGIN{IGNORECASE=1} $0 ~ "^COPY [a-z_]*\\.?\"?"t"\"? " {p=1; n=0; print; next} p && /^\\\.$/{p=0} p && n<8 {print; n++}' "$F"
          done

      - name: Element table (all rows)
        run: |
          F=$(ls dump/*.sql | head -1)
          awk 'BEGIN{IGNORECASE=1} /^COPY [a-z_]*\.?"?element"? /{p=1; print; next} p && /^\\\.$/{p=0} p{print}' "$F" | cut -c1-220

      - name: Functions list
        run: |
          F=$(ls dump/*.sql | head -1)
          grep -nE '^CREATE (OR REPLACE )?(FUNCTION|PROCEDURE)' "$F" | head -100

      - name: spVinDecode source
        run: |
          F=$(ls dump/*.sql | head -1)
          awk 'BEGIN{IGNORECASE=1} /^CREATE (OR REPLACE )?(FUNCTION|PROCEDURE) [a-z_]*\.?"?spvindecode"?\(/{p=1} p{print} p && /^\$(_\$|\$|[a-z_]*\$);?$/{c++; if(c>=1){p=0; c=0}}' "$F" | head -900
