name: NHTSA Dataset Sync

on:
  schedule:
    # 03:00 UTC every Sunday and Monday
    - cron: '0 3 * * 0,1'
  workflow_dispatch:

concurrency:
  group: nhtsa-sync
  # Never cancel a run that may be pushing or deploying
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    name: Sync dataset & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit refreshed datasets
    env:
      # Job-level so the deploy step's `if:` can see it (step-level env is not available there)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh dataset from NHTSA
        run: bun scripts/sync-sql-dump.ts

      - name: Verify (typecheck + tests)
        run: |
          pnpm typecheck
          pnpm test

      - name: Commit refreshed data (only when it changed)
        id: commit_step
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add data/
            git commit -m "chore(data): automated NHTSA catalog refresh"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No dataset changes."
          fi

      - name: Check wrangler.jsonc has a real D1 database_id
        if: steps.commit_step.outputs.has_changes == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if grep -q '"database_id": "local-nhtsa-db"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the placeholder database_id. Commit your real D1 id (see README > Deploy)."
            exit 1
          fi

      - name: Apply D1 migrations
        if: steps.commit_step.outputs.has_changes == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply nhtsa-db --remote

      - name: Deploy worker
        if: steps.commit_step.outputs.has_changes == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
