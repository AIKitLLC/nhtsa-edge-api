name: zz probe WMIYearValidChars (temporary)
on:
  push:
    branches: [claude/exciting-pascal-8khdrj]
    paths: [.github/workflows/zz-probe-cache.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSfL -A "Mozilla/5.0" -o dump.zip "https://vpic.nhtsa.dot.gov/downloads/vPICList_lite_2026_09.plain.zip"
          unzip -p dump.zip '*.sql' | awk '/^COPY vpic\.wmiyearvalidchars /{p=1; next} p && /^\\\.$/{exit} p' > cache.tsv
          wc -l cache.tsv
          echo "== rows per wmi length"; awk -F'\t' '{print length($2)}' cache.tsv | sort | uniq -c
          echo "== distinct wmis"; cut -f2 cache.tsv | sort -u | wc -l
          echo "== year range"; cut -f3 cache.tsv | sort -n | uniq | head -3; cut -f3 cache.tsv | sort -n | uniq | tail -3
          for w in 1V9273 1S9812 1A9393 492365 1V9 1S9 1A9 492 1HG JTD; do echo "== $w"; awk -F'\t' -v w="$w" '$2==w' cache.tsv | awk -F'\t' '{print $3}' | sort | uniq -c | head -5; done
          echo "== JTD 2020 sample"; awk -F'\t' '$2=="JTD" && $3==2020' cache.tsv | sort -t$'\t' -k4n | head -40
          echo "== chars seen"; cut -f5 cache.tsv | sort | uniq -c | sort -rn | head -50
