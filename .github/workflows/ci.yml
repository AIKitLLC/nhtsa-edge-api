name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test (real vPIC data) and bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vPIC assets from data/vpic
        run: pnpm build:data

      - name: Typecheck (worker + scripts)
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Bundle worker (dry-run deploy, checks size limits)
        run: pnpm build
