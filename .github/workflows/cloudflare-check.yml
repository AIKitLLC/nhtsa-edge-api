name: Cloudflare check

# Read-only: verifies the token, the zone and the DNS state that deploying the custom
# domain depends on. Run it before "Deploy production", or after changing the token.
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Hostname to check'
        required: false
        default: data.ai-kit.net
  push:
    paths:
      - '.github/workflows/cloudflare-check.yml'
      - 'scripts/cloudflare/**'

jobs:
  check:
    name: Check Cloudflare for the custom domain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check
        run: bun scripts/cloudflare/check.ts "${{ inputs.hostname || 'data.ai-kit.net' }}"
